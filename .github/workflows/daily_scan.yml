name: Daily 9 AM BDT Job Market Scan

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run 9 AM Job Intelligence Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/pipeline.py

      - name: Commit updated intelligence data
        run: |
          git config user.name "bd-job-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/jobs.db docs/data/market_intel.json
          git diff --staged --quiet || git commit -m "chore: daily 9 AM BDT market scan"
          git push
